name: CI and Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Обновлено до v4 (убирает warning)

      - name: Set up Python 3.10
        uses: actions/setup-python@v5 # Обновлено до v5 (убирает warning)
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coveralls

      - name: Run tests with pytest
        run: |
          # Запускаем pytest. Он автоматически найдет файл test_ciphers.py
          pytest --cov=. --cov-report=xml

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }} # Передаем токен Coveralls
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # Оставляем на всякий случай
          format: cobertura
          file: coverage.xml
